<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Recuperación de contraseña</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#000A3C; padding:24px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#FFFFFF; border-radius:12px; overflow:hidden;">
          <tr>
            <td style="padding:24px; text-align:center;">
              <img src="cid:logo" alt="Logo" width="140" />
            </td>
          </tr>
          <tr>
              <td align="center" style="padding:0 24px 24px 24px;">
                  <h1 style="margin:0 0 12px 0;">Bienvenido al sistema Cerberus</h1>
                  <p style="margin:0 0 16px 0; color:#333; font-size:large">
                      Tu numero de usuario es:
                  </p>
                  <p style="margin:0 0 16px 0; color:#333; font-size:large; font-weight:bold;">{{usuario}}</p>
                  <p style="margin:0 0 16px 0; color:#333; font-size:large">
                      Tu contraseña temporal es:
                  </p>
                  <p style="margin:0 0 16px 0; color:#333; font-size:large; font-weight:bold;">{{contrasena}}</p>
                  <p style="margin: 0 0 16px 0; color: #333; font-size: medium; color: red; font-weight: bold;">
                      Recuerda hacer el cambio de contraseña en tu primer inicio de sesión.
                  </p>
              </td>
          </tr>
          <tr>
            <td style="padding:16px 24px; background:#FFFFFF; color:#666; font-size:12px;">
              © {{Year}} Sistema de seguridad Cerberus
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
